services:
  # ---------------------------------------------------------------------------
  # Data Layer (PostgreSQL)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: erp_flow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-erp_flow}
      ODOO_DB_USER: ${ODOO_DB_USER:-odoo}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:-odoo_secure_db_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/database/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - erp_flow_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-erp_flow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # ERP Layer (Odoo 19 Community Edition)
  # ---------------------------------------------------------------------------
  odoo:
    image: odoo:19.0
    container_name: erp_flow_odoo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
    environment:
      - HOST=postgres
      - PORT=5432
      - USER=${ODOO_DB_USER:-odoo}
      - PASSWORD=${ODOO_DB_PASSWORD:-odoo_secure_db_password}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./services/ERP/odoo.conf:/etc/odoo/odoo.conf
    networks:
      - erp_flow_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8069/')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # AI Layer (Ollama Server)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: erp_flow_ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./services/llm_server/bootstrap.sh:/tmp/bootstrap.sh
    entrypoint: ["/bin/sh", "-c", "chmod +x /tmp/bootstrap.sh && /tmp/bootstrap.sh"]
    networks:
      - erp_flow_net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Orchestration Layer (Temporal Server & UI)
  # ---------------------------------------------------------------------------
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: erp_flow_temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-postgres_secure_password}
      - POSTGRES_SEEDS=postgres
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    networks:
      - erp_flow_net
    healthcheck:
      test: ["CMD-SHELL", "nc -z $$(hostname -i) 7233"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal-ui:
    image: temporalio/ui:latest
    container_name: erp_flow_temporal_ui
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "${TEMPORAL_UI_PORT:-8080}:8080"
    networks:
      - erp_flow_net

  # ---------------------------------------------------------------------------
  # Application Layer (FastAPI Backend & Vue.js Frontend)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: erp_flow_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./services/backend:/app
    environment:
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_password}
      - DB_NAME=${POSTGRES_DB:-erp_flow}
      - DB_HOST=postgres
      - DB_PORT=5432
      - LLM_HOST=http://ollama:11434
      - TEMPORAL_HOST=temporal:7233
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - erp_flow_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: erp_flow_frontend
    restart: unless-stopped
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost/api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - erp_flow_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 5s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Gateway Layer (Nginx Reverse Proxy)
  # ---------------------------------------------------------------------------
  gateway:
    image: nginx:alpine
    container_name: erp_flow_gateway
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-80}:80"
      - "${GATEWAY_SSL_PORT:-443}:443"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - erp_flow_net

# ---------------------------------------------------------------------------
# Volume & Network Configurations
# ---------------------------------------------------------------------------
volumes:
  pgdata:
  odoo-data:
  ollama-data:

networks:
  erp_flow_net:
    driver: bridge
